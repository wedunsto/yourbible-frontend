<ion-card>
  <ion-card-header>
    <ion-card-title>{{ note().title }}</ion-card-title>
    <ion-card-subtitle>
      {{ note().book }} {{ note().chapter }}<span *ngIf="note().verses">:{{ note().verses }}</span>
    </ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    <p>{{ note().notes }}</p>
    <p class="created-at" *ngIf="note().created_at">{{ note().created_at | date }}</p>
  </ion-card-content>

  <div class="card-actions">
    <ion-button color="primary" fill="clear" size="small" (click)="saveBibleStudyNote()">
      Save
    </ion-button>
    <ion-button color="danger" fill="clear" size="small" (click)="deleteBibleStudyNote()">
      Delete
    </ion-button>
  </div>
</ion-card>
