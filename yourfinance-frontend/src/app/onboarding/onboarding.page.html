<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Onboarding</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title class="title">Onboarding</ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="onboarding-form">
    <p>Enter the Bible verse categories you want to study (up to {{ MAX_CATEGORIES }}).</p>
    <form [formGroup]="onboardingForm" (ngSubmit)="submitOnboarding()">
      @for (category of categories().controls; track category; let i = $index) {
        <app-form-input
          [title]="'Category ' + (i + 1)"
          placeholder="e.g. Hope"
          [control]="category">
        </app-form-input>
      }
      <ion-button
        type="button"
        fill="outline"
        aria-label="Add another category"
        [disabled]="!canAddCategory()"
        (click)="addCategory()">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
      <ion-button type="submit" expand="block">Continue</ion-button>
    </form>
  </div>
</ion-content>
